<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Game Bắn Ruồi – Mr Tín</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{
  --green:#a0ffb0;--yellow:#ffdd44;--red:#ff4466;--blue:#44aaff;--cyan:#00ffff;
  --bg:#07070f;--panel:rgba(10,12,28,0.95);--border:#2a2a5a;--dim:#666688;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;font-family:'VT323',monospace;color:#c0c0e0;
  overflow-x:hidden;}
body{padding:10px 8px 20px;}

#topBar{width:680px;max-width:100%;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:5px;font-size:15px;color:var(--dim);flex-wrap:wrap;gap:4px;}
#hud{display:flex;gap:12px;flex-wrap:wrap;}
#hud b{color:#e0e0ff;}
#langToggle{display:flex;gap:4px;}
.langBtn{background:#1a1a3a;color:var(--dim);border:1px solid var(--border);border-radius:3px;
  padding:2px 9px;font-family:'VT323',monospace;font-size:15px;cursor:pointer;}
.langBtn.active{background:#162a20;color:var(--green);border-color:#3a7a5a;}

/* Status bars row */
#statusRow{width:680px;max-width:100%;display:flex;gap:8px;margin-bottom:5px;align-items:center;flex-wrap:wrap;}
.sbar{flex:1;min-width:120px;}
.sbar-label{font-size:12px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between;}
.sbar-track{height:5px;background:#1a1a2a;border-radius:3px;overflow:hidden;}
.sbar-fill{height:100%;border-radius:3px;transition:width .25s;}
#xpFill{background:linear-gradient(90deg,#2a6a3a,var(--green));}
#timerFill{background:linear-gradient(90deg,#44ff88,#ffdd44,#ff4466);transition:width .1s linear;}
#bulletFill{background:linear-gradient(90deg,#4488ff,#44aaff);}
#killFill{background:linear-gradient(90deg,#884400,#ffaa44);}

/* Special buttons row */
#actionRow{width:680px;max-width:100%;display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center;}
#diffBadge{font-family:'VT323',monospace;font-size:15px;padding:2px 10px;border-radius:3px;border:1px solid;display:none;}
#reloadBtn{background:#1a2030;color:#88aaff;border:1px solid #3355aa;border-radius:3px;
  padding:3px 12px;font-family:'VT323',monospace;font-size:15px;cursor:pointer;display:none;}
#reloadBtn:hover{background:#1e2a40;}
#reloadBtn.used{color:#334466;border-color:#1a2030;cursor:default;}
#pierceBtn{background:#1a1a30;color:#cc66ff;border:1px solid #553399;border-radius:3px;
  padding:3px 12px;font-family:'VT323',monospace;font-size:15px;cursor:pointer;display:none;transition:all .15s;}
#pierceBtn.on{background:#2a1a40;color:#ee88ff;border-color:#9955dd;box-shadow:0 0 8px #9955dd44;}
#gunBar{display:none;gap:5px;margin-bottom:6px;flex-wrap:wrap;justify-content:center;width:680px;max-width:100%;}
.gunBtn{background:#12122a;color:var(--dim);border:1px solid var(--border);border-radius:3px;
  padding:3px 8px;font-family:'VT323',monospace;font-size:13px;cursor:pointer;transition:all .12s;
  position:relative;min-width:86px;text-align:center;}
.gunBtn.active{background:#102518;color:var(--green);border-color:#3a7a5a;}
.gunBtn.locked{color:#333355;border-color:#181830;cursor:default;}
.badge{position:absolute;top:-7px;right:-7px;background:var(--yellow);color:#111;font-size:9px;border-radius:8px;padding:1px 5px;font-weight:700;}
.lbadge{position:absolute;top:-7px;right:-7px;background:#222;color:#555;font-size:9px;border-radius:8px;padding:1px 4px;}

#gameCanvas{border:1px solid #1e1e3e;border-radius:6px;cursor:crosshair;display:block;
  background:var(--bg);image-rendering:pixelated;max-width:100%;}
#hint{margin-top:5px;font-size:14px;color:var(--dim);min-height:16px;text-align:center;}
</style>
</head>
<body>
<div id="topBar">

<div id="actionRow">

<div id="gunBar">

let lang='vi',T=LANG.vi;

function setLang(l){
  lang=l;T=LANG[l];
  document.getElementById('btnVI').className='langBtn'+(l==='vi'?' active':'');
  document.getElementById('btnEN').className='langBtn'+(l==='en'?' active':'');
  applyStaticText();updateHUD();
}
function applyStaticText(){
  document.getElementById('hint').textContent=gameState==='playing'?T.hint:'';
  ['Score','Level','Lives','Combo','Kills'].forEach((k,i)=>{
    const ids=['lblScore','lblLevel','lblLives','lblCombo','lblKills'];
    const keys=['score','level','lives','combo','kills'];
    document.getElementById(ids[i]).textContent=T[keys[i]]+':';
  });
  document.getElementById('reloadBtn').textContent=T.reload+' ('+reloadsLeft+')';
  document.getElementById('pierceBtn').textContent=T.pierce+': '+(pierceMode?T.pierceOn:T.pierceOff);
  document.getElementById('timerLbl').textContent=T.timerLbl;
  document.getElementById('bulletLbl').textContent=T.bulletLbl;
  document.getElementById('killLbl').textContent=T.killLbl;
}

/* ── Audio ── */
const AC2=window.AudioContext||window.webkitAudioContext;let ac2;
function getAC(){if(!ac2)ac2=new AC2();return ac2;}
function snd(type){
  try{
    const a=getAC(),g=a.createGain();g.connect(a.destination);
    const t=a.currentTime;
    const S={
      pistol:()=>{const o=a.createOscillator();o.connect(g);o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(75,t+.13);g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.start();o.stop(t+.14);},
      shotgun:()=>{for(let i=0;i<3;i++){const o=a.createOscillator(),n=a.createBiquadFilter();n.type='bandpass';n.frequency.value=180+i*90;o.type='sawtooth';o.connect(n);n.connect(g);o.frequency.setValueAtTime(280+i*60,t+i*.02);o.frequency.exponentialRampToValueAtTime(55,t+.2+i*.02);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t+i*.01);o.stop(t+.24);}},
      rapid:()=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(550,t);o.frequency.exponentialRampToValueAtTime(180,t+.07);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.start();o.stop(t+.08);},
      laser:()=>{const o=a.createOscillator();o.connect(g);o.frequency.setValueAtTime(1100,t);o.frequency.exponentialRampToValueAtTime(280,t+.22);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start();o.stop(t+.23);},
      plasma:()=>{const o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain();o.type='sawtooth';lfo.frequency.value=20;lg.gain.value=220;lfo.connect(lg);lg.connect(o.frequency);o.connect(g);o.frequency.setValueAtTime(750,t);o.frequency.exponentialRampToValueAtTime(130,t+.32);g.gain.setValueAtTime(.38,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start();lfo.start();o.stop(t+.33);lfo.stop(t+.33);},
      hit:()=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(750,t);o.frequency.exponentialRampToValueAtTime(180,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start();o.stop(t+.09);},
      kill:()=>{const o=a.createOscillator();o.connect(g);[500,700,900].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.05));g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start();o.stop(t+.21);},
      multikill:()=>{[400,600,800,1000,1200].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.2,t+i*.04);g.gain.exponentialRampToValueAtTime(.001,t+i*.04+.1);o.start(t+i*.04);o.stop(t+i*.04+.11);});},
      escape:()=>{const o=a.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(90,t+.16);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start();o.stop(t+.17);},
      unlock:()=>{[500,700,900,1100].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.18,t+i*.08);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.12);o.start(t+i*.08);o.stop(t+i*.08+.13);});},
      levelup:()=>{[400,600,800,1000,1200].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.15,t+i*.06);g.gain.exponentialRampToValueAtTime(.001,t+i*.06+.1);o.start(t+i*.06);o.stop(t+i*.06+.11);});},
      reload:()=>{[200,300,400,500].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.15,t+i*.05);g.gain.exponentialRampToValueAtTime(.001,t+i*.05+.08);o.start(t+i*.05);o.stop(t+i*.05+.09);});},
      pierce:()=>{const o=a.createOscillator();o.connect(g);o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.setValueAtTime(1200,t+.08);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start();o.stop(t+.19);},
      start:()=>{[300,500,700].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.15,t+i*.07);g.gain.exponentialRampToValueAtTime(.001,t+i*.07+.1);o.start(t+i*.07);o.stop(t+i*.07+.11);});},
      win:()=>{[400,500,600,800,1000,1200,1400].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.15,t+i*.08);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.12);o.start(t+i*.08);o.stop(t+i*.08+.13);});},
    };
    if(S[type])S[type]();
  }catch(e){}
}

/* ── Draw helpers ── */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function rrF(x,y,w,h,r){rr(x,y,w,h,r);ctx.fill();}
function rrS(x,y,w,h,r){rr(x,y,w,h,r);ctx.stroke();}

function drawBG(){
  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.022)';
  for(let gx=0;gx<W;gx+=40)for(let gy=0;gy<H;gy+=40)ctx.fillRect(gx,gy,1,1);
  ctx.fillStyle='#141428';ctx.fillRect(0,H-46,W,46);
  ctx.fillStyle='#22224a';ctx.fillRect(0,H-47,W,2);
  const nc=['#3344ff','#ff3366','#33ffcc','#ff9900','#aa44ff'];
  for(let i=0;i<5;i++){ctx.fillStyle=nc[i];ctx.globalAlpha=.12;ctx.fillRect(24+i*124,H-47,96,2);ctx.globalAlpha=1;}
}

function pixelFly(x,y,size,variant,angle){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  const s=size;
  const C=[{body:'#3a2a1a',wing:'rgba(180,220,255,.62)',eye:'#ff4444'},{body:'#2a3a1a',wing:'rgba(180,255,180,.62)',eye:'#ffaa00'},{body:'#3a1a3a',wing:'rgba(255,180,255,.62)',eye:'#00ffff'}][variant%3];
  ctx.fillStyle=C.body;ctx.fillRect(-s*2,-s,s*4,s*2);ctx.fillRect(-s,-s*2,s*2,s*4);ctx.fillRect(-s*1.5,-s*1.5,s*3,s*3);
  ctx.fillStyle=C.wing;ctx.beginPath();ctx.ellipse(-s*2,-s*1.5,s*2.5,s*1.2,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*2,-s*1.5,s*2.5,s*1.2,.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.eye;ctx.fillRect(-s*.8,-s*.8,s*.7,s*.7);ctx.fillRect(s*.1,-s*.8,s*.7,s*.7);
  ctx.restore();
}

function drawBullet(b){
  const g=GUNS[b.gunId]||GUNS[0];ctx.save();
  const isPierce=b.pierce;
  if(b.laser){
    ctx.globalAlpha=b.life*.9;ctx.strokeStyle=isPierce?'#ee88ff':g.color;ctx.lineWidth=isPierce?5:3;
    ctx.shadowColor=isPierce?'#cc44ff':g.color;ctx.shadowBlur=isPierce?14:8;
    ctx.beginPath();ctx.moveTo(b.ox,b.oy);ctx.lineTo(b.tx,b.ty);ctx.stroke();
    ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(b.ox,b.oy);ctx.lineTo(b.tx,b.ty);ctx.stroke();
  }else{
    ctx.globalAlpha=Math.min(1,b.life*2);
    ctx.fillStyle=isPierce?'#dd88ff':g.color;
    ctx.shadowColor=isPierce?'#cc44ff':g.color;ctx.shadowBlur=isPierce?10:6;
    const r=b.gunId===4?6:b.gunId===1?4:3;
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r*.45,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* ── RELOAD & PIERCE ── */
function doReload(){
  if(gameState!=='playing')return;
  if(reloadsLeft<=0){fltxt(W/2,H/2-40,T.noReload,'#ff4466');return;}
  const d=DIFF[difficulty];
  const added=d.reloadAmt;
  bulletUsed=Math.max(0,bulletUsed-added);
  reloadsLeft--;
  snd('reload');
  fltxt(W/2,GUN_Y-50,T.reloadDone,'#44aaff',true);
  updateHUD();
}
function togglePierce(){
  if(gameState!=='playing')return;
  pierceMode=!pierceMode;
  snd('pierce');
  const pb=document.getElementById('pierceBtn');
  pb.textContent=T.pierce+': '+(pierceMode?T.pierceOn:T.pierceOff);
  pb.className=pierceMode?'on':'';
  fltxt(W/2,GUN_Y-80,'🔮 '+(pierceMode?T.pierceOn:T.pierceOff),pierceMode?'#cc66ff':'#888899',true);
}

document.addEventListener('keydown',e=>{
  if(e.code==='KeyR'&&gameState==='playing'){e.preventDefault();doReload();}
  if(e.code==='KeyP'&&gameState==='playing'){e.preventDefault();togglePierce();}
  if(e.code==='Space'){
    e.preventDefault();
    if(gameState==='intro')gameState='difficulty';
    else if(gameState==='gameover')gameState='difficulty';
    else if(gameState==='howto'){if(currentPage<T.howtoPages.length-1)currentPage++;else gameState='difficulty';}
  }
  if(e.code==='Escape'){
    if(gameState==='howto')gameState='intro';
    else if(gameState==='difficulty')gameState='intro';
  }
});

/* ── HUD ── */
function updateHUD(){
  document.getElementById('sd').textContent=score;
  document.getElementById('ld').textContent=level;
  document.getElementById('hpd').textContent=lives>0?'♥ '.repeat(lives).trim():'💀';
  document.getElementById('cd').textContent='x'+combo;
  document.getElementById('kd').textContent=totalKills;

  // XP
  const next=GUNS.filter(g=>g.unlockAt>totalKills).sort((a,b)=>a.unlockAt-b.unlockAt);
  if(next.length){
    const prevAt=GUNS.filter(g=>unlockedGuns.includes(g.id)&&g.unlockAt<next[0].unlockAt).reduce((m,g)=>Math.max(m,g.unlockAt),0);
    document.getElementById('xpFill').style.width=Math.min(100,((totalKills-prevAt)/(next[0].unlockAt-prevAt))*100)+'%';
    document.getElementById('xpVal').textContent=totalKills+'/'+next[0].unlockAt;
  }else{
    document.getElementById('xpFill').style.width='100%';
    document.getElementById('xpVal').textContent='MAX';
  }

  if(gameState==='playing'&&difficulty){
    const d=DIFF[difficulty];
    const rem=maxBullets-bulletUsed;
    const remS=Math.max(0,Math.ceil(timeLeft/1000));
    // timer
    document.getElementById('timerSbar').style.display='';
    document.getElementById('timerVal').textContent=remS+'s';
    document.getElementById('timerFill').style.width=(timeLeft/totalTime*100)+'%';
    // bullets
    document.getElementById('bulletSbar').style.display='';
    document.getElementById('bulletVal').textContent=rem+' / '+maxBullets;
    document.getElementById('bulletFill').style.width=Math.max(0,(rem/maxBullets)*100)+'%';
    // kills
    document.getElementById('killSbar').style.display='';
    document.getElementById('killVal').textContent=sessionKills+'/'+targetKills;
    document.getElementById('killFill').style.width=Math.min(100,(sessionKills/targetKills)*100)+'%';
    // reload btn
    const rb=document.getElementById('reloadBtn');
    rb.textContent=T.reload+' ('+reloadsLeft+')';
    rb.className=reloadsLeft===0?'used':'';
    // pierce btn
    const pb=document.getElementById('pierceBtn');
    pb.textContent=T.pierce+': '+(pierceMode?T.pierceOn:T.pierceOff);
    pb.className=pierceMode?'on':'';
  }else{
    document.getElementById('timerSbar').style.display='none';
    document.getElementById('bulletSbar').style.display='none';
    document.getElementById('killSbar').style.display='none';
  }

  GUNS.forEach((g,i)=>{
    const btn=document.getElementById('gb'+i);if(!btn)return;
    const locked=!unlockedGuns.includes(g.id);
    btn.className='gunBtn'+(selectedGun===i&&!locked?' active':'')+(locked?' locked':'');
    btn.innerHTML=`${ICONS[i]} ${T.gunNames[i]}<br><small>${locked?T.gunLock[i]+' kills':T.gunDescs[i]}</small>`;
    if(locked)btn.innerHTML+=`<span class="lbadge">🔒</span>`;
    else if(selectedGun===i)btn.innerHTML+=`<span class="badge">${T.on}</span>`;
  });
}
function selectGun(i){if(!unlockedGuns.includes(i))return;selectedGun=i;updateHUD();}
function checkUnlocks(){
  GUNS.forEach(g=>{
    if(totalKills>=g.unlockAt&&!unlockedGuns.includes(g.id)){
      unlockedGuns.push(g.id);fltxt(W/2,H/2-60,T.unlockMsg(T.gunNames[g.id]),'#ffdd00',true);
      snd('unlock');updateHUD();
    }
  });
}

/* ── FIRE ── */
function fireGun(mx,my){
  const now=performance.now(),gun=GUNS[selectedGun];
  if(now-lastShot<gun.cooldown)return false;
  const rem=maxBullets-bulletUsed;
  if(rem<=0){fltxt(W/2,GUN_Y-55,T.outOfBullets,'#ff4466');return false;}
  lastShot=now;snd(gun.sound);muzzleFlash=1;bulletUsed++;

  // count bullets: shotgun uses 1 but fires 5 pellets
  const isPierce=pierceMode;

  if(gun.id===3){// laser: line cast
    const dx=mx-W/2,dy=my-GUN_Y,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len;
    bullets.push({gunId:3,ox:W/2,oy:GUN_Y,tx:W/2+nx*900,ty:GUN_Y+ny*900,x:mx,y:my,life:1,laser:true,nx,ny,pierce:isPierce});
    // all flies on line take damage
    flies.filter(f=>{
      const fx=f.x-W/2,fy=f.y-GUN_Y,proj=fx*nx+fy*ny;
      if(proj<0)return false;
      return Math.abs(fx*ny-fy*nx)<f.size*4+10;
    }).forEach(f=>{f.hp-=gun.dmg;});
    return true;
  }
  if(gun.id===4){
    for(let i=0;i<8;i++){const ang=(Math.PI*2/8)*i;bullets.push({gunId:4,x:W/2,y:GUN_Y,vx:Math.cos(ang)*4.2,vy:Math.sin(ang)*4.2,life:1,dmg:gun.dmg,pierce:isPierce,hitFlies:new Set()});}
    return true;
  }
  if(gun.id===1){
    const baseAng=Math.atan2(my-GUN_Y,mx-W/2);
    for(let i=0;i<gun.shotCount;i++){
      const off=((i-(gun.shotCount-1)/2)/(gun.shotCount-1))*(gun.spread*(Math.PI/180));
      const ang=baseAng+off;
      bullets.push({gunId:1,x:W/2,y:GUN_Y,vx:Math.cos(ang)*(6.5+Math.random()),vy:Math.sin(ang)*(6.5+Math.random()),life:1,dmg:gun.dmg,pierce:isPierce,hitFlies:new Set()});
    }
    return true;
  }
  const ang=Math.atan2(my-GUN_Y,mx-W/2);
  bullets.push({gunId:gun.id,x:W/2,y:GUN_Y,vx:Math.cos(ang)*7.5,vy:Math.sin(ang)*7.5,life:1,dmg:gun.dmg,pierce:isPierce,hitFlies:new Set()});
  return true;
}

/* ── Process kill ── */
function doKill(fly, bColor, bulletPierce){
  spawnP(fly.x,fly.y,bulletPierce?'#dd88ff':bColor,bulletPierce?18:14);
  totalKills++;sessionKills++;
  const pts=10*combo;score+=pts;
  fltxt(fly.x,fly.y-22,'+'+pts,combo>3?'#ffdd00':bulletPierce?'#dd88ff':bColor);
  combo=Math.min(combo+1,8);comboTimer=150;
  snd(combo>=4?'multikill':'kill');
  checkUnlocks();
  if(score>=level*300){level++;snd('levelup');fltxt(W/2,70,T.levelUpMsg(level),'#ffdd00',true);}
  checkWin();
}

function checkWin(){
  if(difficulty&&sessionKills>=targetKills)endGame(true);
}

/* ── Click ── */
canvas.addEventListener('click',function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);

  if(gameState==='intro'){
    const pw=430,ph=300,px=(W-pw)/2,py=(H-ph)/2-18;
    const bw=185,bh=38,b1x=(W-bw*2-16)/2,b2x=b1x+bw+16,by2=py+ph-62;
    if(mx>=b1x&&mx<=b1x+bw&&my>=by2&&my<=by2+bh){gameState='howto';currentPage=0;}
    else if(mx>=b2x&&mx<=b2x+bw&&my>=by2&&my<=by2+bh)gameState='difficulty';
    return;
  }
  if(gameState==='howto'){
    const pw=460,ph=340,px=(W-pw)/2,py=(H-ph)/2-15;
    const bw=130,bh=36,by2=py+ph-40;
    if(mx>=px+20&&mx<=px+20+bw&&my>=by2&&my<=by2+bh){if(currentPage===0)gameState='intro';else currentPage--;}
    if(currentPage<T.howtoPages.length-1){if(mx>=px+pw-20-bw&&mx<=px+pw-20&&my>=by2&&my<=by2+bh)currentPage++;}
    else{const bw2=170;if(mx>=px+pw-20-bw2&&mx<=px+pw-20&&my>=by2&&my<=by2+bh)gameState='difficulty';}
    return;
  }
  if(gameState==='difficulty'){
    const pw=520,ph=330,px=(W-pw)/2,py=(H-ph)/2-20;
    const cw=142,ch=195,gap=10,startX=px+(pw-cw*3-gap*2)/2;
    ['easy','medium','hard'].forEach((dk,i)=>{
      const bx=startX+i*(cw+gap),by2=py+68,sbh=32,sby=by2+ch-40,sbx=bx+10,sbw=cw-20;
      if(mx>=sbx&&mx<=sbx+sbw&&my>=sby&&my<=sby+sbh)startGame(dk);
    });
    const bw=130,bh=34,by3=py+ph-42;
    if(mx>=px+18&&mx<=px+18+bw&&my>=by3&&my<=by3+bh)gameState='intro';
    return;
  }
  if(gameState==='gameover'){
    const pw=380,ph=270,py=(H-ph)/2-10;
    const bw=190,bh=36,bx=(W-bw)/2-50,bx2=(W-bw)/2+55,by2=py+ph-52;
    if(mx>=bx&&mx<=bx+bw&&my>=by2&&my<=by2+bh)gameState='difficulty';
    if(mx>=bx2&&mx<=bx2+bw&&my>=by2&&my<=by2+bh){difficulty&&startGame(difficulty);}
    return;
  }
  if(gameState!=='playing')return;
  const fired=fireGun(mx,my);if(!fired)return;
  // Laser: process kills immediately
  if(GUNS[selectedGun].id===3){
    let kills=0;
    for(let i=flies.length-1;i>=0;i--){if(flies[i].hp<=0){const f=flies.splice(i,1)[0];doKill(f,'#ff44ff',pierceMode);kills++;}}
    if(!kills){combo=1;comboTimer=0;}
  }
  updateHUD();
});

canvas.addEventListener('mousemove',function(e){
  if(gameState!=='playing')return;
  const rect=canvas.getBoundingClientRect();
  gunTargetAngle=Math.atan2((e.clientY-rect.top)*(H/rect.height)-GUN_Y,(e.clientX-rect.left)*(W/rect.width)-W/2);
});

/* ── UPDATE ── */
function update(dt){
  if(gameState!=='playing'){
    introTick+=dt*.016;
    if(Math.random()<.007&&demoFlies.length<9)spawnDemoFly();
    for(let i=demoFlies.length-1;i>=0;i--){
      const f=demoFlies[i];f.wobble+=f.wobbleSpeed;f.x+=f.vx*(dt*.06);f.y+=f.vy*(dt*.06);
      f.angle=Math.atan2(f.vy,f.vx)+Math.sin(f.wobble)*.3;
      if(f.x<-45||f.x>W+45||f.y<-45||f.y>H-120)demoFlies.splice(i,1);
    }
    return;
  }
  gunAngle+=(gunTargetAngle-gunAngle)*.17;

  // Spawn rate: tuned so enough flies appear in time
  const d=DIFF[difficulty];
  flySpawnTimer+=dt;
  // Base interval: much shorter, flies spawn in bursts at higher difficulty
  const baseInterval=Math.max(220,900-level*60);
  // At high flyMult, also spawn extra flies per tick
  if(flySpawnTimer>baseInterval){
    spawnFly();
    // extra flies based on difficulty mult
    const extra=Math.floor((d.flyMult-1));
    for(let e=0;e<extra;e++)if(Math.random()<.7)spawnFly();
    flySpawnTimer=0;
  }

  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=1;updateHUD();}}

  // Timer
  if(timerRunning&&timeLeft>0){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;timerRunning=false;endGame(false,'timeup');}
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.laser){b.life-=.045;if(b.life<=0){bullets.splice(i,1);}continue;}
    b.x+=b.vx*(dt*.1);b.y+=b.vy*(dt*.1);b.life-=.016;
    if(b.life<=0||b.x<-25||b.x>W+25||b.y<-25||b.y>H+25){bullets.splice(i,1);continue;}
    const gun=GUNS[b.gunId]||GUNS[0];
    let hitAny=false;
    for(let j=flies.length-1;j>=0;j--){
      const f=flies[j];
      if(b.hitFlies&&b.hitFlies.has(j))continue; // pierce: don't rehit same fly index
      if(Math.hypot(b.x-f.x,b.y-f.y)<f.size*4+gun.radius*.28){
        f.hp-=(b.dmg||1)*(b.pierce?1.5:1);
        snd('hit');
        if(f.hp<=0){
          const dead=flies.splice(j,1)[0];
          doKill(dead,gun.color,b.pierce);
          if(!b.pierce){bullets.splice(i,1);hitAny=true;break;}
          // pierce: bullet continues, mark this fly as hit (indices shift so just reduce life a bit)
          if(b.hitFlies)b.hitFlies.add(j);
        }else{
          spawnP(f.x,f.y,'#ffaa44',4);
          if(!b.pierce){bullets.splice(i,1);hitAny=true;break;}
          if(b.hitFlies)b.hitFlies.add(j);
        }
      }
    }
    if(hitAny&&!b.pierce&&i<bullets.length&&bullets[i]===b)bullets.splice(i,1);
  }

  // Flies movement
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];f.wobble+=f.wobbleSpeed;f.turnTimer+=dt;
    if(f.turnTimer>700+Math.random()*350){
      f.vx+=(Math.random()-.5)*.9;f.vy+=(Math.random()-.5)*.9;
      const spd=Math.hypot(f.vx,f.vy)||1,ts=(0.75+level*.12)*d.speed;
      f.vx=(f.vx/spd)*ts;f.vy=(f.vy/spd)*ts;f.turnTimer=0;
    }
    f.x+=f.vx*(dt*.06);f.y+=f.vy*(dt*.06);
    f.angle=Math.atan2(f.vy,f.vx)+Math.sin(f.wobble)*.3;
    if(f.y>H-84)f.vy=-Math.abs(f.vy);
    if(f.x<-46||f.x>W+46||f.y<-46||f.y>H+46){
      flies.splice(i,1);lives--;snd('escape');
      if(lives<=0){endGame(false,'lives');return;}
      updateHUD();
    }
  }

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.032;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){const t=floatingTexts[i];t.y+=t.vy;t.life-=.016;if(t.life<=0)floatingTexts.splice(i,1);}
  updateHUD();
}

/* ── GAME CONTROL ── */
function startGame(diff){
  difficulty=diff;const d=DIFF[diff];
  flies=[];bullets=[];particles=[];floatingTexts=[];demoFlies=[];
  score=0;lives=3;level=1;combo=1;comboTimer=0;
  totalKills=0;sessionKills=0;flySpawnTimer=0;lastShot=0;selectedGun=0;unlockedGuns=[0];
  gunAngle=-Math.PI/2;gunTargetAngle=-Math.PI/2;muzzleFlash=0;pierceMode=false;
  maxBullets=d.maxBullets;bulletUsed=0;reloadsLeft=d.reloads;
  timeLeft=d.time*1000;totalTime=d.time*1000;targetKills=d.target;timerRunning=true;
  gameState='playing';
  const badge=document.getElementById('diffBadge');
  badge.style.display='inline-block';badge.style.color=d.color;badge.style.borderColor=d.color+'55';badge.style.background=d.color+'11';
  badge.textContent=(lang==='vi'?d.label:d.en);
  document.getElementById('reloadBtn').style.display='inline-block';
  document.getElementById('pierceBtn').style.display='inline-block';
  document.getElementById('gunBar').style.display='flex';
  document.getElementById('hint').textContent=T.hint;
  snd('start');updateHUD();
}
function endGame(win){
  gameState='gameover';timerRunning=false;
  document.getElementById('gunBar').style.display='none';
  document.getElementById('reloadBtn').style.display='none';
  document.getElementById('pierceBtn').style.display='none';
  document.getElementById('diffBadge').style.display='none';
  document.getElementById('hint').textContent='';
  if(win)snd('win');
}

/* ── MAIN LOOP ── */
function gameFrame(ts){
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  update(dt);
  if(gameState==='intro')          drawIntro(introTick);
  else if(gameState==='howto')     drawHowto(introTick);
  else if(gameState==='difficulty')drawDifficulty(introTick);
  else if(gameState==='playing')   drawPlaying();
  else if(gameState==='gameover')  drawGameOver(sessionKills>=targetKills);
  requestAnimationFrame(gameFrame);
}

applyStaticText();updateHUD();
lastTime=performance.now();
requestAnimationFrame(gameFrame);
</script>
</body>
</html>
