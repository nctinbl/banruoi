<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Game Bắn Ruồi – Mr Tín</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

:root {
  --green:   #a0ffb0;
  --green2:  #3aff7a;
  --yellow:  #ffdd44;
  --red:     #ff4466;
  --blue:    #44aaff;
  --cyan:    #00ffff;
  --purple:  #cc66ff;
  --bg:      #07070f;
  --panel:   rgba(10,12,28,0.95);
  --border:  #2a2a5a;
  --text:    #c0c0e0;
  --dim:     #666688;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;min-height:100vh;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  font-family:'VT323',monospace;
  color:var(--text);
  overflow-x:hidden;
}
body{padding:12px 8px 28px;}

/* ─── TOP BAR ─────────────────────────────────────────── */
#topBar{
  width:660px;max-width:100%;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
  font-size:15px;
  color:var(--dim);
  flex-wrap:wrap;gap:6px;
}
#hud{display:flex;gap:16px;flex-wrap:wrap;}
#hud b{color:#e0e0ff;}
#langToggle{display:flex;gap:4px;}
.langBtn{
  background:#1a1a3a;color:var(--dim);
  border:1px solid var(--border);border-radius:3px;
  padding:2px 10px;font-family:'VT323',monospace;font-size:15px;cursor:pointer;
}
.langBtn.active{background:#162a20;color:var(--green);border-color:#3a7a5a;}

/* ─── XP BAR ──────────────────────────────────────────── */
#xpWrap{width:660px;max-width:100%;margin-bottom:5px;}
#xpLabel{font-size:13px;color:var(--dim);margin-bottom:2px;}
#xpBar{height:5px;background:#1a1a2a;border-radius:3px;overflow:hidden;}
#xpFill{height:100%;background:linear-gradient(90deg,#2a6a3a,var(--green));border-radius:3px;transition:width .4s;width:0%;}

/* ─── GUN BAR ─────────────────────────────────────────── */
#gunBar{
  display:none;gap:5px;margin-bottom:7px;flex-wrap:wrap;justify-content:center;
  width:660px;max-width:100%;
}
.gunBtn{
  background:#12122a;color:var(--dim);
  border:1px solid var(--border);border-radius:3px;
  padding:3px 9px;font-family:'VT323',monospace;font-size:14px;
  cursor:pointer;position:relative;min-width:90px;text-align:center;
  transition:all .12s;
}
.gunBtn.active{background:#102518;color:var(--green);border-color:#3a7a5a;}
.gunBtn.locked{color:#333355;border-color:#181830;cursor:default;}
.badge{position:absolute;top:-7px;right:-7px;background:var(--yellow);color:#111;font-size:10px;border-radius:8px;padding:1px 5px;font-weight:700;font-family:sans-serif;}
.lbadge{position:absolute;top:-7px;right:-7px;background:#222;color:#555;font-size:10px;border-radius:8px;padding:1px 5px;}

/* ─── CANVAS ──────────────────────────────────────────── */
#gameCanvas{
  border:1px solid #1e1e3e;
  border-radius:6px;
  cursor:crosshair;
  display:block;
  background:var(--bg);
  image-rendering:pixelated;
  max-width:100%;
}
#hint{margin-top:5px;font-size:14px;color:var(--dim);min-height:18px;text-align:center;}

/* ─── DIFFICULTY BADGE ────────────────────────────────── */
#diffBadge{
  display:none;
  font-family:'VT323',monospace;font-size:16px;
  padding:2px 14px;border-radius:3px;margin-bottom:5px;
  border:1px solid;
}

/* ─── TIMER BAR ───────────────────────────────────────── */
#timerWrap{width:660px;max-width:100%;display:none;margin-bottom:5px;}
#timerLabel{font-size:13px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between;}
#timerBar{height:5px;background:#1a1a2a;border-radius:3px;overflow:hidden;}
#timerFill{height:100%;background:linear-gradient(90deg,#44ff88,#ffdd44,#ff4466);border-radius:3px;transition:width .1s linear;width:100%;}
</style>

let lang='vi', T=LANG.vi;

function setLang(l){
  lang=l;T=LANG[l];
  document.getElementById('btnVI').className='langBtn'+(l==='vi'?' active':'');
  document.getElementById('btnEN').className='langBtn'+(l==='en'?' active':'');

function applyStaticText(){

/* ─────────────────── AUDIO ─────────────────────────────── */
const AC2=window.AudioContext||window.webkitAudioContext;let ac2;
function getAC(){if(!ac2)ac2=new AC2();return ac2;}
function playSound(type){
  try{
    const a=getAC(),g=a.createGain();g.connect(a.destination);
    const sounds={
      pistol:()=>{const o=a.createOscillator();o.connect(g);o.frequency.setValueAtTime(400,a.currentTime);o.frequency.exponentialRampToValueAtTime(80,a.currentTime+.12);g.gain.setValueAtTime(.28,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.13);},
      shotgun:()=>{for(let i=0;i<3;i++){const o=a.createOscillator(),n=a.createBiquadFilter();n.type='bandpass';n.frequency.value=200+i*80;o.type='sawtooth';o.connect(n);n.connect(g);o.frequency.setValueAtTime(300+i*50,a.currentTime+i*.02);o.frequency.exponentialRampToValueAtTime(60,a.currentTime+.18+i*.02);g.gain.setValueAtTime(.22,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start(a.currentTime+i*.01);o.stop(a.currentTime+.22);}},
      rapid:()=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(600,a.currentTime);o.frequency.exponentialRampToValueAtTime(200,a.currentTime+.07);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.07);o.start();o.stop(a.currentTime+.08);},
      laser:()=>{const o=a.createOscillator();o.connect(g);o.frequency.setValueAtTime(1200,a.currentTime);o.frequency.exponentialRampToValueAtTime(300,a.currentTime+.2);g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.21);},
      plasma:()=>{const o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain();o.type='sawtooth';lfo.frequency.value=18;lg.gain.value=200;lfo.connect(lg);lg.connect(o.frequency);o.connect(g);o.frequency.setValueAtTime(800,a.currentTime);o.frequency.exponentialRampToValueAtTime(150,a.currentTime+.3);g.gain.setValueAtTime(.35,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();lfo.start();o.stop(a.currentTime+.31);lfo.stop(a.currentTime+.31);},
      hit:()=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.setValueAtTime(800,a.currentTime);o.frequency.exponentialRampToValueAtTime(200,a.currentTime+.08);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);o.start();o.stop(a.currentTime+.09);},
      kill:()=>{const o=a.createOscillator();o.connect(g);o.frequency.setValueAtTime(500,a.currentTime);o.frequency.setValueAtTime(700,a.currentTime+.05);o.frequency.setValueAtTime(900,a.currentTime+.1);g.gain.setValueAtTime(.22,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.start();o.stop(a.currentTime+.19);},
      escape:()=>{const o=a.createOscillator();o.connect(g);o.type='sawtooth';o.frequency.setValueAtTime(300,a.currentTime);o.frequency.exponentialRampToValueAtTime(100,a.currentTime+.15);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.start();o.stop(a.currentTime+.16);},
      unlock:()=>{[500,700,900,1100].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.18,a.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.08+.12);o.start(a.currentTime+i*.08);o.stop(a.currentTime+i*.08+.13);});},
      levelup:()=>{[400,600,800,1000,1200].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime+i*.06);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.06+.1);o.start(a.currentTime+i*.06);o.stop(a.currentTime+i*.06+.11);});},
      start:()=>{[300,500,700].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime+i*.07);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.07+.1);o.start(a.currentTime+i*.07);o.stop(a.currentTime+i*.07+.11);});},
      win:()=>{[400,500,600,800,1000,1200].forEach((f,i)=>{const o=a.createOscillator();o.connect(g);o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.09+.12);o.start(a.currentTime+i*.09);o.stop(a.currentTime+i*.09+.13);});},
    };
    if(sounds[type]) sounds[type]();
  }catch(e){}
}

/* ─────────────────── DRAW HELPERS ──────────────────────── */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function rrFill(x,y,w,h,r){rr(x,y,w,h,r);ctx.fill();}
function rrStroke(x,y,w,h,r){rr(x,y,w,h,r);ctx.stroke();}

function drawBackground(){
  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let gx=0;gx<W;gx+=40)for(let gy=0;gy<H;gy+=40)ctx.fillRect(gx,gy,1,1);
  // ground
  ctx.fillStyle='#141428';ctx.fillRect(0,H-48,W,48);
  ctx.fillStyle='#22224a';ctx.fillRect(0,H-49,W,2);
  // neon strips
  const nc=['#3344ff','#ff3366','#33ffcc','#ff9900','#aa44ff'];
  for(let i=0;i<5;i++){ctx.fillStyle=nc[i];ctx.globalAlpha=.12;ctx.fillRect(30+i*118,H-49,90,2);ctx.globalAlpha=1;}
}

/* ─────────────────── GUN PIXEL ART ─────────────────────── */
function drawGun(cx,cy,angle,gunId,flash){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
  const C=[
    {base:'#556677',dark:'#334455',barrel:'#778899',grip:'#8B5E3C',gripD:'#5C3D1E',trigger:'#aabbcc',muzzle:'#aaccee'},
    {base:'#665544',dark:'#443322',barrel:'#8a7060',grip:'#6B4226',gripD:'#3D1E0D',trigger:'#bbaa99',muzzle:'#ddbb99'},
    {base:'#335544',dark:'#224433',barrel:'#55aa88',grip:'#2C5C3C',gripD:'#1A3C28',trigger:'#88ccaa',muzzle:'#aaffcc'},
    {base:'#553366',dark:'#332244',barrel:'#9966cc',grip:'#4B2266',gripD:'#2E1040',trigger:'#cc99ff',muzzle:'#ff88ff'},
    {base:'#226677',dark:'#114455',barrel:'#44aacc',grip:'#1A4455',gripD:'#0D2C38',trigger:'#66ddff',muzzle:'#00ffff'},
  ][gunId]||{base:'#556677',dark:'#334455',barrel:'#778899',grip:'#8B5E3C',gripD:'#5C3D1E',trigger:'#aabbcc',muzzle:'#aaccee'};

  if(gunId===1){

/* ─────────────────── PIXEL FLY ─────────────────────────── */
function pixelFly(x,y,size,variant,angle){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  const s=size;
  const C=[
    {body:'#3a2a1a',wing:'rgba(180,220,255,.6)',eye:'#ff4444'},
    {body:'#2a3a1a',wing:'rgba(180,255,180,.6)',eye:'#ffaa00'},
    {body:'#3a1a3a',wing:'rgba(255,180,255,.6)',eye:'#00ffff'},
  ][variant%3];
  ctx.fillStyle=C.body;ctx.fillRect(-s*2,-s,s*4,s*2);ctx.fillRect(-s,-s*2,s*2,s*4);ctx.fillRect(-s*1.5,-s*1.5,s*3,s*3);
  ctx.fillStyle=C.wing;
  ctx.beginPath();ctx.ellipse(-s*2,-s*1.5,s*2.5,s*1.2,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse( s*2,-s*1.5,s*2.5,s*1.2, .4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.eye;ctx.fillRect(-s*.8,-s*.8,s*.7,s*.7);ctx.fillRect(s*.1,-s*.8,s*.7,s*.7);
  ctx.restore();
}

function drawBullet(b){
  const g=GUNS[b.gunId]||GUNS[0];ctx.save();
  if(b.laser){
    ctx.globalAlpha=b.life*.9;ctx.strokeStyle=g.color;ctx.lineWidth=3;ctx.shadowColor=g.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(b.ox,b.oy);ctx.lineTo(b.tx,b.ty);ctx.stroke();
    ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(b.ox,b.oy);ctx.lineTo(b.tx,b.ty);ctx.stroke();
  }else{
    ctx.globalAlpha=Math.min(1,b.life*2);ctx.fillStyle=g.color;ctx.shadowColor=g.color;ctx.shadowBlur=6;
    const r=b.gunId===4?6:b.gunId===1?4:3;
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r*.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

  }
  for(const p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.restore();}
  for(const t of floatingTexts){ctx.save();ctx.globalAlpha=Math.max(0,t.life);ctx.fillStyle=t.color;ctx.font='bold 16px "VT323",monospace';ctx.textAlign='center';ctx.fillText(t.text,t.x,t.y);ctx.restore();}
  if(combo>2){ctx.save();ctx.fillStyle='#ffdd00';ctx.font='18px "VT323",monospace';ctx.textAlign='right';ctx.globalAlpha=.9;ctx.fillText('COMBO x'+combo+'!',W-10,22);ctx.restore();}
  drawGun(W/2,GUN_Y+20,gunAngle,selectedGun,muzzleFlash);
  const gun=GUNS[selectedGun];
  ctx.save();ctx.fillStyle=gun.color;ctx.font='16px "VT323",monospace';ctx.textAlign='right';ctx.globalAlpha=.8;
  ctx.fillText('['+T.gunNames[selectedGun]+']',W-8,H-54);ctx.restore();
  // aim line
  ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle=gun.color;ctx.lineWidth=1;ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.moveTo(W/2,GUN_Y);ctx.lineTo(W/2+Math.cos(gunAngle)*320,GUN_Y+Math.sin(gunAngle)*320);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  // bullet count HUD
  if(difficulty&&bulletCount>=0){
    const rem=bulletCount-bulletUsed;
    ctx.save();ctx.fillStyle=rem<10?'#ff4466':rem<20?'#ffdd44':'#88aaff';
    ctx.font='15px "VT323",monospace';ctx.textAlign='left';ctx.globalAlpha=.85;
    ctx.fillText('🔸 '+rem,8,H-54);ctx.restore();
  }
  // kills progress
  if(difficulty){
    ctx.save();ctx.fillStyle='#66aa88';ctx.font='15px "VT323",monospace';ctx.textAlign='left';ctx.globalAlpha=.8;
    ctx.fillText('🪲 '+sessionKills+'/'+targetKills,8,H-72);ctx.restore();
  }
  if(muzzleFlash>0)muzzleFlash=Math.max(0,muzzleFlash-.09);
}

/* ─────────────────── HUD ───────────────────────────────── */
function updateHUD(){
  document.getElementById('sd').textContent=score;
  document.getElementById('ld').textContent=level;
  document.getElementById('hpd').textContent=lives>0?'♥ '.repeat(lives).trim():'💀';
  document.getElementById('cd').textContent='x'+combo;
  document.getElementById('kd').textContent=totalKills;
  // XP bar
  const next=GUNS.filter(g=>g.unlockAt>totalKills).sort((a,b)=>a.unlockAt-b.unlockAt);
  let pct=100;
  if(next.length){
    const prevAt=GUNS.filter(g=>unlockedGuns.includes(g.id)&&g.unlockAt<next[0].unlockAt).reduce((m,g)=>Math.max(m,g.unlockAt),0);
    pct=Math.min(100,((totalKills-prevAt)/(next[0].unlockAt-prevAt))*100);
    document.getElementById('xpLabel').textContent=`XP: ${totalKills} / ${next[0].unlockAt}`;
  }else{
    document.getElementById('xpLabel').textContent=`XP: MAX`;
  }
  document.getElementById('xpFill').style.width=pct+'%';

  GUNS.forEach((g,i)=>{
    const btn=document.getElementById('gb'+i);if(!btn)return;
    const locked=!unlockedGuns.includes(g.id);
    btn.className='gunBtn'+(selectedGun===i&&!locked?' active':'')+(locked?' locked':'');
    btn.innerHTML=`${ICONS[i]} ${T.gunNames[i]}<br><small>${locked?T.gunLock[i]+' kills':T.gunDescs[i]}</small>`;
    if(locked)btn.innerHTML+=`<span class="lbadge">🔒</span>`;
    else if(selectedGun===i)btn.innerHTML+=`<span class="badge">${T.on}</span>`;
  });

  // timer
  if(gameState==='playing'&&difficulty){
    document.getElementById('timerWrap').style.display='block';
    const rem=Math.max(0,Math.ceil(timeLeft/1000));
    document.getElementById('timerCount').textContent=rem+'s';
    document.getElementById('timerFill').style.width=(timeLeft/totalTime*100)+'%';
  }else{
    document.getElementById('timerWrap').style.display='none';
  }
}
function selectGun(i){if(!unlockedGuns.includes(i))return;selectedGun=i;updateHUD();}
function checkUnlocks(){
  GUNS.forEach(g=>{
    if(totalKills>=g.unlockAt&&!unlockedGuns.includes(g.id)){
      unlockedGuns.push(g.id);
      fltxt(W/2,H/2-60,T.unlockMsg(T.gunNames[g.id]),'#ffdd00');
      playSound('unlock');updateHUD();
    }
  });
}

/* ─────────────────── FIRE ──────────────────────────────── */
function fireGun(mx,my){
  const now=performance.now(),gun=GUNS[selectedGun];
  if(now-lastShot<gun.cooldown)return false;
  // bullet limit check
  if(difficulty&&bulletCount>=0&&bulletUsed>=bulletCount){
    fltxt(W/2,H/2-40,T.outOfBullets,'#ff4466');
    return false;
  }
  lastShot=now;playSound(gun.sound);muzzleFlash=1;
  if(difficulty&&bulletCount>=0)bulletUsed++;

  if(gun.id===3){
    const dx=mx-W/2,dy=my-GUN_Y,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len;
    bullets.push({gunId:3,ox:W/2,oy:GUN_Y,tx:W/2+nx*900,ty:GUN_Y+ny*900,x:mx,y:my,life:1,laser:true,nx,ny});
    flies.filter(f=>{const fx=f.x-W/2,fy=f.y-GUN_Y,proj=fx*nx+fy*ny;if(proj<0)return false;return Math.abs(fx*ny-fy*nx)<f.size*4+8;}).forEach(f=>{f.hp-=gun.dmg;});
    return true;
  }
  if(gun.id===4){for(let i=0;i<8;i++){const ang=(Math.PI*2/8)*i;bullets.push({gunId:4,x:W/2,y:GUN_Y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,life:1,dmg:gun.dmg});}return true;}
  if(gun.id===1){
    const baseAng=Math.atan2(my-GUN_Y,mx-W/2);
    for(let i=0;i<gun.shotCount;i++){const off=((i-(gun.shotCount-1)/2)/(gun.shotCount-1))*(gun.spread*(Math.PI/180));const ang=baseAng+off;bullets.push({gunId:1,x:W/2,y:GUN_Y,vx:Math.cos(ang)*(6+Math.random()),vy:Math.sin(ang)*(6+Math.random()),life:1,dmg:gun.dmg});}
    return true;
  }
  const ang=Math.atan2(my-GUN_Y,mx-W/2);
  bullets.push({gunId:gun.id,x:W/2,y:GUN_Y,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,life:1,dmg:gun.dmg});
  return true;
}

/* ─────────────────── CLICK HANDLER ─────────────────────── */
canvas.addEventListener('click',function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);

  if(gameState==='intro'){
    const pw=420,ph=300,px=(W-pw)/2,py=(H-ph)/2-18;
    const bw=180,bh=38,b1x=(W-bw*2-16)/2,b2x=b1x+bw+16,by2=py+ph-62;
    if(mx>=b1x&&mx<=b1x+bw&&my>=by2&&my<=by2+bh){gameState='howto';currentPage=0;}
    else if(mx>=b2x&&mx<=b2x+bw&&my>=by2&&my<=by2+bh){gameState='difficulty';}
    return;
  }
  if(gameState==='howto'){
    const pw=440,ph=310,px=(W-pw)/2,py=(H-ph)/2-15;
    const bw=130,bh=36,by2=py+ph-38;
    // back
    if(mx>=px+20&&mx<=px+20+bw&&my>=by2&&my<=by2+bh){
      if(currentPage===0)gameState='intro'; else currentPage--;
    }
    // next / choose
    if(currentPage<T.howtoPages.length-1){
      if(mx>=px+pw-20-bw&&mx<=px+pw-20&&my>=by2&&my<=by2+bh)currentPage++;
    }else{
      const bw2=160;
      if(mx>=px+pw-20-bw2&&mx<=px+pw-20&&my>=by2&&my<=by2+bh)gameState='difficulty';
    }
    return;
  }
  if(gameState==='difficulty'){
    const pw=500,ph=320,px=(W-pw)/2,py=(H-ph)/2-20;
    const cw=138,ch=180,gap=10,startX=px+(pw-cw*3-gap*2)/2;
    const dkeys=['easy','medium','hard'];
    dkeys.forEach((dk,i)=>{
      const bx=startX+i*(cw+gap),by2=py+68;
      const sbw=cw-20,sbh=32,sbx=bx+10,sby=by2+ch-40;
      if(mx>=sbx&&mx<=sbx+sbw&&my>=sby&&my<=sby+sbh) startGame(dk);
    });
    // back
    const bw=130,bh=34,by3=py+ph-40;
    if(mx>=px+18&&mx<=px+18+bw&&my>=by3&&my<=by3+bh)gameState='intro';
    return;
  }
  if(gameState==='gameover'){
    const pw=360,ph=250,py=(H-ph)/2-10;
    const bw=200,bh=36,bx=(W-bw)/2,by2=py+ph-50;
    if(mx>=bx&&mx<=bx+bw&&my>=by2&&my<=by2+bh)gameState='difficulty';
    return;
  }
  if(gameState!=='playing')return;

  const fired=fireGun(mx,my);if(!fired)return;
  const gun=GUNS[selectedGun];
  if(gun.id===3){
    let anyKill=false;
    for(let i=flies.length-1;i>=0;i--){
      const f=flies[i];
      if(f.hp<=0){spawnP(f.x,f.y,'#ff44ff',14);flies.splice(i,1);totalKills++;sessionKills++;score+=10*combo;fltxt(f.x,f.y-22,'+'+(10*combo),combo>2?'#ffdd00':'#ff44ff');combo=Math.min(combo+1,8);comboTimer=140;playSound('kill');anyKill=true;checkUnlocks();if(score>=level*200){level++;playSound('levelup');fltxt(W/2,60,T.levelUpMsg(level),'#ffdd00');}
      checkWin();}
    }
    if(!anyKill){combo=1;comboTimer=0;}
  }
  updateHUD();
});

canvas.addEventListener('mousemove',function(e){
  if(gameState!=='playing')return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);
  gunTargetAngle=Math.atan2(my-GUN_Y,mx-W/2);
});

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(gameState==='intro')gameState='difficulty';
    else if(gameState==='gameover')gameState='difficulty';
    else if(gameState==='howto'){if(currentPage<T.howtoPages.length-1)currentPage++;else gameState='difficulty';}
  }
  if(e.code==='Escape'){
    if(gameState==='howto')gameState='intro';
    else if(gameState==='difficulty')gameState='intro';
  }
});

/* ─────────────────── UPDATE ────────────────────────────── */
function update(dt){
  // demo flies for intro/difficulty/howto
  if(gameState!=='playing'){
    introTick+=dt*.016;
    if(Math.random()<.007&&demoFlies.length<8)spawnDemoFly();
    for(let i=demoFlies.length-1;i>=0;i--){
      const f=demoFlies[i];f.wobble+=f.wobbleSpeed;f.x+=f.vx*(dt*.06);f.y+=f.vy*(dt*.06);
      f.angle=Math.atan2(f.vy,f.vx)+Math.sin(f.wobble)*.3;
      if(f.x<-40||f.x>W+40||f.y<-40||f.y>H-120)demoFlies.splice(i,1);
    }
    return;
  }

  gunAngle+=(gunTargetAngle-gunAngle)*.16;
  flySpawnTimer+=dt;
  const d=DIFF[difficulty];
  const si=Math.max(400,1600-level*90-(d?200*(d.flies-1):0));
  if(flySpawnTimer>si){
    spawnFly();
    if(level>=2&&Math.random()<.35)spawnFly();
    if(d&&d.flies>=2&&Math.random()<.25)spawnFly();
    flySpawnTimer=0;
  }
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=1;updateHUD();}}

  // timer countdown
  if(timerRunning&&timeLeft>0){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;timerRunning=false;endGame(false,'timeup');}
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.laser){b.life-=.04;if(b.life<=0)bullets.splice(i,1);continue;}
    b.x+=b.vx*(dt*.1);b.y+=b.vy*(dt*.1);b.life-=.017;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue;}
    const gun=GUNS[b.gunId]||GUNS[0];let hit=false;
    for(let j=flies.length-1;j>=0;j--){
      const f=flies[j];
      if(Math.hypot(b.x-f.x,b.y-f.y)<f.size*4+gun.radius*.3){
        f.hp-=(b.dmg||1);playSound('hit');
        if(f.hp<=0){
          spawnP(f.x,f.y,gun.color,14);flies.splice(j,1);totalKills++;sessionKills++;
          score+=10*combo;fltxt(f.x,f.y-22,'+'+(10*combo),combo>2?'#ffdd00':gun.color);
          combo=Math.min(combo+1,8);comboTimer=140;playSound('kill');
          checkUnlocks();if(score>=level*200){level++;playSound('levelup');fltxt(W/2,60,T.levelUpMsg(level),'#ffdd00');}
          checkWin();
        }else spawnP(f.x,f.y,'#ffaa44',5);
        hit=true;if(b.gunId!==4)break;
      }
    }
    if(hit&&b.gunId!==4)bullets.splice(i,1);
  }

  // flies movement
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];f.wobble+=f.wobbleSpeed;f.turnTimer+=dt;
    if(f.turnTimer>750+Math.random()*400){
      f.vx+=(Math.random()-.5)*.8;f.vy+=(Math.random()-.5)*.8;
      const spd=Math.hypot(f.vx,f.vy)||1,ts=(0.8+level*.15)*(DIFF[difficulty]?.speed||1);
      f.vx=(f.vx/spd)*ts;f.vy=(f.vy/spd)*ts;f.turnTimer=0;
    }
    f.x+=f.vx*(dt*.06);f.y+=f.vy*(dt*.06);
    f.angle=Math.atan2(f.vy,f.vx)+Math.sin(f.wobble)*.3;
    if(f.y>H-85)f.vy=-Math.abs(f.vy);
    if(f.x<-44||f.x>W+44||f.y<-44||f.y>H+44){
      flies.splice(i,1);lives--;playSound('escape');
      if(lives<=0){endGame(false,'lives');return;}
      updateHUD();
    }
  }

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.033;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){const t=floatingTexts[i];t.y+=t.vy;t.life-=.017;if(t.life<=0)floatingTexts.splice(i,1);}
  updateHUD();
}

/* ─────────────────── WIN CHECK ─────────────────────────── */
function checkWin(){
  if(difficulty&&sessionKills>=targetKills){
    endGame(true);
  }
}

/* ─────────────────── GAME CONTROL ──────────────────────── */
function startGame(diff){
  difficulty=diff;
  const d=DIFF[diff];
  flies=[];bullets=[];particles=[];floatingTexts=[];demoFlies=[];
  score=0;lives=3;level=1;combo=1;comboTimer=0;
  totalKills=0;sessionKills=0;flySpawnTimer=0;lastShot=0;selectedGun=0;unlockedGuns=[0];
  gunAngle=-Math.PI/2;gunTargetAngle=-Math.PI/2;muzzleFlash=0;
  timeLeft=d.time*1000;totalTime=d.time*1000;targetKills=d.target;
  bulletCount=d.bullets>=999?-1:d.bullets;bulletUsed=0;
  timerRunning=true;
  gameState='playing';

  // show/update difficulty badge
  const badge=document.getElementById('diffBadge');
  badge.style.display='inline-block';
  badge.style.color=d.color;badge.style.borderColor=d.color+'66';
  badge.style.background=d.color+'11';
  badge.textContent=(lang==='vi'?d.label:d.en);

  document.getElementById('gunBar').style.display='flex';
  document.getElementById('timerWrap').style.display='block';
  document.getElementById('hint').textContent=T.hint;
  playSound('start');updateHUD();
}

function endGame(win,reason){
  gameState='gameover';
  timerRunning=false;
  document.getElementById('gunBar').style.display='none';
  document.getElementById('timerWrap').style.display='none';
  document.getElementById('diffBadge').style.display='none';
  document.getElementById('hint').textContent='';
  if(win)playSound('win');
}

/* ─────────────────── MAIN LOOP ─────────────────────────── */
function gameFrame(ts){
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  update(dt);
  if(gameState==='intro')          drawScreen_intro(introTick);
  else if(gameState==='howto')     drawScreen_howto(introTick);
  else if(gameState==='difficulty')drawScreen_difficulty(introTick);
  else if(gameState==='playing')   drawScreen_playing();
  else if(gameState==='gameover')  drawScreen_gameover(
    // detect win: check sessionKills vs target
    sessionKills>=targetKills
  );
  requestAnimationFrame(gameFrame);
}

applyStaticText();updateHUD();
lastTime=performance.now();
requestAnimationFrame(gameFrame);
</script>
